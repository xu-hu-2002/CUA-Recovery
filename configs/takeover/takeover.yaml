schema_version: takeover-protocol/1.0

repeats: 3
max_steps: 100
timeout_seconds: 3600
depths: [0, 5, 10, 15, 20, 25]
conditions: [unaware]
allowed_conditions: [unaware, notified, diagnosed, hinted]

environment_config: configs/environments/mypcbench_1280x800.yaml

prefix:
  source: repaired  # repaired | original
  repaired_dir: canonical_repaired
  trajectory_filename: trajectory.jsonl
  on_missing_repaired: error  # error | skip | fallback_original

history:
  strip_reasoning: true
  openai_context_screenshots: 20
  evocua_cross_agent: true

replay_verification:
  enabled: true
  on_mismatch: reject  # reject | warn
  on_missing_expected: reject  # reject | warn
  ignore_components: []
