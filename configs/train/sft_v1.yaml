schema_version: sft-build-config/2.0

format: recovery

split:
  function: recovery.gen.splits:split_of
  loader: recovery.gen.splits:load_workflow_splits
  file: data/synthesis/workflow_splits.json

loss:
  objective: nll
  weighted:
    input: 0.0
    action: 1.0
    thought: 0.5
    ledger: 0.5
    check_min: 1.0

training:
  base_model: Qwen3.5-35B-A3B
  epochs: 1
  global_batch_size: 256
  learning_rate: 1.0e-5
  lr_scheduler: cosine
  max_context_tokens: 32768
  max_images_per_sample: 20

recovery:
  base_agent: qwen3_5_35b_a3b
  hint_levels: [l1_step, l2_evidence, l3_state_diff]
  attempts_per_level: 8
  teacher:
    agent: claude_opus_4_8
    attempts: 1
    hint_level: l3_state_diff
  max_recovery_steps: 100
  observation_ops: [confirm, verify]
  leak_filter:
    policy: drop
    ngram: 5
    patterns:
      - '\bhint\b'
      - 'takeover diagnosis'
      - '\b(i was|i''ve been|i have been|we were) (told|informed)\b'
      - 'root[- ]cause (evidence|is recorded)'

success_control:
  match: global
  tolerance: 0.02  # relative distance to the target token total
  counted: input+target
  chars_per_token: 4.0
  tokens_per_image: 0
  seed: 20260930

steps:
  ratios:
    detection_plus_recovery: 0.10
    verification: 0.05
    negative_per_detection: 2.5
  offsets_after_evidence: [0, 2, 5, 9]
  ledger:
    min_value_chars: 3
