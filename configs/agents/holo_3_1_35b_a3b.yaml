# 只冻结论文实际使用的配置；不写未经测量的性能数字。
#
# 标 `# live` 的字段由 agent_config.load_agent_config() 读取，经
# tool_agent.protocol_from_config() 装配成 ToolAgentProtocol —— 改这里就会改变
# 实际行为。缺字段、拼错、取值越界一律 hard fail，代码侧没有默认值可回退。
agent_id: holo_3_1_35b_a3b
family: holo31
scaffold: derail_tool_agent
agent_type: derail_holo31
checkpoint: Hcompany/Holo-3.1-35B-A3B
revision: 2bdb92851a8cd9d72cdd891fdf38cfcc7fefae2c
output_format: native_function_calling
history_renderer: derail.adapters.holo31.Holo31Adapter
live_adapter: derail.mypcbench.factory.create_mypcbench_agent
# 每个 endpoint 占几张卡。VM 并发度 = 可用 GPU 数 / 这个数，由
# scripts/lib/collection_config.sh 在起服务时算，不写死在配置里。
tensor_parallel_size: 2
# live —— SafePyAutoGUICompiler 的枚举值。
coordinate_protocol: normalized_0_1000
# live —— prompts/agents/ 下的文件名，由 tool_agent._read_frozen_prompt() 读取。
system_prompt_file: holo_3_1_35b_a3b_mypcbench_system.txt
# live —— 与 qwen 对齐到 0.0；Holo 官方推荐的 0.8 是通用对话口径，GUI grounding
# 输出的是精确坐标，采样温度会让点击位置抖动。
temperature: 0.0
# live
max_tokens: 2048
# live —— 上下文策略对齐上游 qwen35vl_agent（history_n=100 / image_max=20 /
# fold_size=10 + Previous actions）。四个 derail_tool_agent 统一到这一套。
max_images_in_context: 20
# live —— 保留完整消息的 turn 数（上游 history_n）。超出的 turn 整组丢掉，动作由
# previous_action_log 兜住。
history_turns: 100
# live —— 折叠图片的粒度（上游 fold_size）。成块折叠让前缀只增不减，prompt cache
# 才不会每步失效。
image_fold_size: 10
# live —— 窗口外 turn 的动作压成 `Previous actions:` 附在当前 user 消息上。日志
# 取编译后的 pyautogui 串而非模型 content：kimi-k3 有 33% 的步返回空 content。
previous_action_log: true
# live —— required 会逼模型每轮必须调工具，想说"做不到"时没有出口；v1 里 Holo
# 因此一次都没主动发过 fail，70 次 FAIL 全是守卫掐的。统一为 auto。
tool_choice: auto
# live —— 2 而不是 1：Holo 打批的习惯很顽固，第一次修复常常只从三个动作减到两个，
# 第二次才收敛。四个 derail_tool_agent 必须同值，否则失败分布不可比。
schema_repair_attempts: 2
# live —— 按模型给出的顺序执行全部 call；MyPCBench 会逐动作 env.step 并截图。
# 另三个 derail_tool_agent 用保守单交互，这是刻意保留的差异。
multi_tool_policy: execute_all_calls_in_order
# live —— 0 = 停用。v1 的实测代价：184 局里 70 局被守卫掐断，被掐断的局判分均值
# 0.066，自己跑到 DONE 的局是 0.379。要复现 v1 就设回 8 / 15。
alternating_action_repeat_limit: 0
# live
stalled_state_step_limit: 0
# live —— GUI-only，无 bash 工具面。
enable_bash: false
# 01_collect_all.sh 预估时长用；不影响采集行为。
eta_step_seconds: 20.6
eta_step_seconds_source: v1 smoke 实测单步中位（eager 配置下测得，实际更快）
status: execute_all_calls_in_order_unit_verified_live_smoke_required
