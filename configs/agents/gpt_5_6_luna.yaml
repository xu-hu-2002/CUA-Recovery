# scaffold: upstream_runner —— 与 gpt_5_5 完全同一条代码路径（--agent-type
# openai_cuabash：Responses API + 内置 computer/shell 工具），只换 model 名，因此
# 两者互为可比的原生 baseline。DERAIL 的 factory 碰不到它，本文件除身份与并发
# 字段外是纯文档。
#
# 来历：由 wyx/f2-collection-judge-updates 分支带入（合并于 2bca388），跑过一次
# smoke（20260806T065417Z-gpt_5_6_luna-smoke_one，49 分钟 SUCCESSFUL），此后未
# 进入任何正式采集批次。与判官用的 gpt-5.6-terra 是两回事：terra 是 judge 模型，
# luna 是被采集的 agent。留档待定，不要与 terra 混写进正文。
agent_id: gpt_5_6_luna
family: openai_computer_use
scaffold: upstream_runner
agent_type: openai_cuabash
model: gpt-5.6-luna
api_snapshot: routify/protocol/openai/v1 (2026-08-06)
output_format: native_computer_call
history_renderer: zdr_stateless_replay
live_adapter: MyPCBench.agent-harness.agents.openai_cua
# VM 并发度。托管 API 不占卡，上限是配额而非显存；与 gpt_5_5 共用同一个 OpenAI
# project 配额，同时跑两个 agent 前先确认余量。
num_vms: 4
# 01_collect_all.sh 预估时长用；不影响采集行为。
eta_step_seconds: 9.0
eta_step_seconds_source: 借用 gpt_5_5 实测值（同代码路径同网关）；luna 未单独实测
status: registered_smoke_only_not_in_any_formal_batch
notes: >-
  routify 组织启用 Zero Data Retention，previous_response_id 被拒，故走
  OPENAI_ZDR_STATELESS=1 的客户端全历史回放（store:false +
  reasoning.encrypted_content）。详见 docs/ROUTIFY_API_MATRIX.md。
