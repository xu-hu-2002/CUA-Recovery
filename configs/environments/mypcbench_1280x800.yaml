environment_id: mypcbench_1280x800
screen_width: 1280
screen_height: 800
coordinate_origin: top_left
snapshot_backend: TODO
reset_command: TODO

determinism_on_error: warn
disabled_nondeterminism_sources:
  apt_auto_update: 'for u in apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service unattended-upgrades.service packagekit.service; do systemctl cat "$u" >/dev/null 2>&1 || continue; sudo -n systemctl mask --now "$u" || exit 1; done'
  snap_refresh: 'command -v snap >/dev/null 2>&1 || exit 0; sudo -n snap refresh --hold'
  update_notifier: 'pkill -x update-notifier; [ $? -le 1 ]'
  desktop_notification_banners: 'DISPLAY=:0 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus gsettings set org.gnome.desktop.notifications show-banners false'

state_probe_enabled: true
state_probe_on_error: warn
state_probe_file: state_probes.jsonl
state_probe_record_output: true
state_probe_output_max_chars: 4000
state_probes:
  app_databases:
    kind: sqlite_digest
    databases_glob: /data/*.sqlite
    script: infra/snapshot/changelog_replay.py
    volatile_columns: infra/volatile_columns.json
  user_files:
    kind: shell
    command: 'cd "$HOME" && for d in Desktop Documents Downloads; do [ -d "$d" ] && find "$d" -type f -exec sha256sum {} +; done | sort -k2'
