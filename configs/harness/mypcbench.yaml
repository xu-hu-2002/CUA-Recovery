harness_id: mypcbench
upstream_repo: https://github.com/ljang0/MyPCBench.git
upstream_commit: caf9c754ffe0b41c7e629e17fff19299774af1cb
local_root: third_party/MyPCBench
tracked_in_git: false

patches:
  - path: patches/mypcbench_caf9c754_recovery_agents.patch
    applies_to: agent-harness/agents/（含 openai_cuabash.py 的工具轨迹回填）, agent-harness/env.py, agent-harness/run_mypcbench.py, agent-harness/run_parallel_tasks.py
    applied_by: scripts/collection/collect_trajectories.sh
  - path: patches/mypcbench_caf9c754_message_trajectory_agents.patch
    applies_to: agent-harness/agents/claude_cuabash.py, agent-harness/agents/openai_cuabash.py, agent-harness/run_mypcbench.py
    applied_by: scripts/collection/collect_trajectories.sh（在 RECOVERY adapter patch 之后）
  - path: patches/mypcbench_caf9c754_native_responses_state.patch
    applies_to: agent-harness/agents/openai_cuabash.py, agent-harness/run_mypcbench.py
    applied_by: scripts/collection/collect_trajectories.sh（在 tool-message trajectory patch 之后）
  - path: patches/mypcbench_caf9c754_recovery_judge.patch
    applies_to: agent-harness/utils/osworld_full_traj_judge.py, agent-harness/utils/rubric_judge.py
    applied_by: scripts/setup_third_party.sh
  - path: patches/mypcbench_caf9c754_message_first_judge.patch
    applies_to: agent-harness/utils/osworld_full_traj_judge.py
    applied_by: scripts/setup_third_party.sh（在 RECOVERY judge patch 之后）
  - path: patches/mypcbench_caf9c754_judge_resilience_v2.patch
    applies_to: agent-harness/judge_results.py, agent-harness/utils/osworld_full_traj_judge.py
    applied_by: scripts/setup_third_party.sh（在 message-first judge patch 之后）

owns:
  judge_hyperparameters: configs/judges/mypcbench_rubric.yaml
  collection_runtime: configs/collection/mypcbench_runtime.yaml
  environment: configs/environments/mypcbench_1280x800.yaml
  environment_hooks: src/recovery/rollout/state_probe.py
  task_sources: configs/collection/sources.yaml
  agent_identity: configs/agents/*.yaml

snapshots:
  generator: scripts/collection/dump_upstream_prompts.py
  drift_check: python scripts/collection/dump_upstream_prompts.py --check
  agent_system_prompts: prompts/agents/upstream_resolved/
  judge_prompts: prompts/judges/
  judge_prompts_upstream_original: prompts/judges/upstream_original/

judge_prompt_fork:
  date: 2026-08-09
  patch: patches/mypcbench_caf9c754_recovery_judge.patch
  message_priority_patch: patches/mypcbench_caf9c754_message_first_judge.patch
  target: agent-harness/utils/osworld_full_traj_judge.py:FULL_TRAJ_JUDGMENT_SYSTEM
  decided_by: 用户（本次显式决定，两条都适用于全部 agent，不按模型分叉）
  changes:
    - 证据优先级：完整 message/action trajectory（模型消息、工具调用、工具输出、
      已执行 GUI action）是主要证据；截图只作辅助佐证，不能因为截图不清晰就推断失败。
      只出现在最终消息里、没有任何动作/工具输出/截图支撑的声称，仍然不算。
    - 判结果不判路径：rubric 字面点名某个 App 或 UI 路径时，agent 用别的手段
      （直读数据存储、调 API、用代码生成文件）达到同一终态也算通过。
  why_uniform: >-
    不按模型分叉是关键。规则本身与模型无关，而 GUI-only 的 agent 根本没有工具调用
    可采信（实测工具轮占比：gpt5_5 50.5%，qwen3_5 1.9%，kimi_k3 0.0%），
    所以统一规则事实上只作用于用 shell 的模型，但形式上一视同仁 —— 否则组间差异
    将无法区分「模型更强」与「判得更松」。
  what_it_measures: >-
    这一改把基准的语义从「能不能像人一样操作桌面软件」移向「能不能把事办成」。
    这是一次显式的方法学选择，必须写进论文，不能当作 bug fix 一笔带过。
  consequence: >-
    我们的数字自此完全是 RECOVERY 自己的尺子，与 mypcbench.com leaderboard 的差距
    不再仅是判官模型替换，还叠加了评判规则的改动。任何表格都不得并列两者。
  prerequisite: >-
    依赖 message trajectory agents patch 的工具消息回填。旧数据的 traj.jsonl 中
    response 为空，规则改了也无内容可采信；judge 会拒绝 action 非空但 message 为空的
    旧轨迹。必须重采后重判才生效。

upstream_defaults:
  runner_max_steps: 100
  openai_zdr_keep_images: 4
  qwen_image_max: 20
  runner_task_timeout_seconds: 7200
  agent_api_retry_times: 5
  judge_default_model: gemini-3.1-flash-lite-preview
  judge_default_max_images: 200
  judge_default_concurrency: 4
  done_sentinel: "```DONE``` 或独占一行的 DONE"

known_defects:
  - id: tool_call_payload_empty
    where: agent-harness/run_mypcbench.py:400-405（**上游原生代码**，非 RECOVERY patch 引入）
    what: >-
      纯工具轮写进 traj.jsonl 的行里 response 是空字符串（该轮模型只发工具调用、
      不发消息文本），于是 rubric_bundle 的 raw_response_text 为空，判官只看到一行
      "Action: TOOL_CALL"。上游该处注释写明这行轨迹存在的目的正是「让判官看到中间
      的工具工作」，意图被空载荷架空。
    upstream_status: >-
      commit caf9c754 自带；leaderboard 上 GPT-5.5 的 83.6 就是在带着这个缺陷的
      轨迹上、由 gemini-3.1-flash-lite 判出来的。**所以它不是我们与 83.6 的差距来源。**
    impact_on_us: >-
      只打击大量使用 shell 的 agent。gpt-5.5 有 50.5% 的步数是工具轮，33.9% 的失败
      rubric 判词是「截图里看不到」；Qwen3.5/Kimi-K3 工具轮占比 0-1.9%。修复的上界是
      gpt-5.5 均分 +0.145（0.569 -> 0.714）。
    caution: >-
      修它会让我们的判分更忠实，但离上游口径**更远**（上游未修）。不要用它去追 83.6。
      若要修，必须同时用修复后的 harness 重采并重判全部三个 agent，否则模型之间也不可比。
    recovery_fix: >-
      patches/mypcbench_caf9c754_message_trajectory_agents.patch 统一保证工具轮有 message：
      OpenAI 保存 shell/function/computer call 及可见输出，Claude 保存 tool_use/tool_result；
      同轮已有自然语言时追加而不覆盖。runner 对其余 agent 的已执行 action 再做非空兜底。
      工具文本不参与 DONE/FAIL 扫描。judge 每步 message 上限放宽至 4000 字符。
    judge_side_fix: >-
      scripts/takeover/bundle_prefix.py 在判分前从 bundle 一侧补全：空载荷的纯工具轮
      从该行 agent_metadata.tool_messages（Claude runner 从对齐的 messages.json）取回调用
      与输出写进 raw_response_text；接管前缀步取 canonical 行的 action + tool_result。
      scripts/judge/run_judge.sh 与 scripts/judge/judge_rubrics.sh 每次判分前都跑它（幂等），所以已有的
      旧轨迹不必重采也能按完整工具证据重判。
    status: >-
      采集侧已修复（2026-08-16，新轨迹）；判分侧由 14 补全（旧轨迹重判即可，无需重采）

  - id: silent_abort_no_actions
    where: agent-harness/run_mypcbench.py（上游原生代码；RECOVERY 已补诊断）
    what: >-
      predict() 返回空 actions 且 agent 无 pending 时，循环直接 break。上游在
      break 前只写一行 "No actions returned at step N" 日志，response_text 被丢弃、
      不落任何轨迹 —— 事后无法判断模型究竟返回了什么。
    frequency: >-
      这是目前 episode 中断的主要出口：v1 首采 39/39、重跑 14/39（36%）、
      bashfix probe 6/20（30%）。中断的 episode 分数天然接近 0，会系统性压低均分。
    recovery_fix: >-
      break 前把 resp_str 打进日志，并落一行 action="NO_ACTIONS" 的轨迹（done=False，
      info.kind="abort_no_actions"，带 has_pending / consecutive_empty /
      consecutive_api_errors）。据此可区分三种成因：空响应、重试耗尽后的
      "(openai api error: ...)"、以及给了最终答复却没带 ```DONE``` 哨兵。
    known_related: >-
      run_mypcbench.py 的 API 错误检测只匹配 "Error code:" 前缀，而 agent 重试耗尽
      时返回 "(openai api error: ...)"，匹配不上，所以那条路径也从这个 break 退出。
      暂未改动控制流，先靠日志把两者区分开。
    status: 诊断已补（2026-08-09）；根因待下次采集的数据确认

incomparable_with_leaderboard:
  reason: judge model substitution
  paper_judge: gemini-3.1-flash-lite-preview
  our_judge: gpt-5.6-terra
  calibration:
    - agent: qwen3_5_35b_a3b
      ours: {rubric: 36.8, perfect: 9.2}
      leaderboard: {rubric: 42.4, perfect: 7.6}
      note: 吻合。该 agent 工具轮占比 1.9%，几乎全靠 GUI，证据都在截图里
    - agent: gpt_5_5
      ours: {rubric: 56.9, perfect: 12.5}
      leaderboard: {rubric: 83.6, perfect: 45.1}
      note: >-
        差 26.7/32.6 点。该 agent 工具轮占比 50.5%，大量工作只发生在 shell 里。
        两个判官对「无截图证据的工具工作」宽严不同，差异只在这类 agent 上显现。
  conclusion: >-
    我们的三个 agent 都由同一判官打分，彼此可比；但整套数字与 mypcbench.com 的
    leaderboard 不在同一把尺子上，任何表格都不得把两者并列。

status: pinned_2026_08_08
