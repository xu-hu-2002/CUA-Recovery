judge_id: recovery_judge_gpt56_terra
model: gpt-5.6-terra

same_source_groups:
  - [gpt-5.6-terra, gpt-5.6-sol]

ear:
  max_segments: null
  missing_policy: exclude
  repeat_unit: episode

aggregation:
  repeats: 3
  missing_counts_as_failure: true

final_state:
  max_chars: 8000
  environment_config: configs/environments/mypcbench_1280x800.yaml

temperature: 0.0
api_invocation_policy:
  requires_explicit_user_approval_per_run: true
  approval_env: RECOVERY_OPENAI_API_APPROVED
  purpose_env: RECOVERY_OPENAI_API_PURPOSE
  credentials_alone_are_not_consent: true
