judge_id: recovery_judge_gpt56_terra
model: gpt-5.6-terra

same_source_groups:
  - [gpt-5.6-terra]

ear:
  max_segments: null
  missing_policy: exclude
  repeat_unit: episode

aggregation:
  repeats: 3
  missing_counts_as_failure: true

final_state:
  max_chars: 8000

rubric:
  provider: openai
  api_key_env: OPENAI_API_KEY
  force_official_endpoint: true
  flavor: full_trajectory
  max_images: 200
  max_image_mb: 50.0
  image_format: png
  image_quality: 85
  reasoning_effort: low
  max_completion_tokens: 16384
  max_retries: 4
  concurrency: 4  # parallel rubric calls per task
  timeout_seconds: 1000  # per-task wall clock, retries included

temperature: 0.0
api_invocation_policy:
  requires_explicit_user_approval_per_run: true
  approval_env: RECOVERY_OPENAI_API_APPROVED
  purpose_env: RECOVERY_OPENAI_API_PURPOSE
  credentials_alone_are_not_consent: true
