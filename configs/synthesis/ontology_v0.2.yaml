schema_version: ontology/0.2

operations:
  - retrieve
  - resolve
  - filter
  - compare
  - aggregate
  - verify
  - decide
  - create
  - modify
  - delete
  - communicate
  - confirm

state_changing_operations:
  - create
  - modify
  - delete
  - communicate

dependency_edge_kinds:
  - data_dependency
  - state_dependency
  - control_dependency

reversibility_classes:
  R0: No persistent state change (browse, query, navigate).
  R1: Local modification undoable inside the same application (an unsaved draft edit).
  R2: Destructive or overwriting modification recoverable through version, backup or reset.
  R3: Commitment to a shared or external system that ordinary undo cannot fully revert.
side_effect_reversibility_classes: [R1, R2, R3]
irreversible_classes: [R3]
high_consequence_classes: [R2, R3]

effect_types:
  write_file: {default_class: R1, category: create}
  overwrite_file: {default_class: R2, category: modify}
  delete_file: {default_class: R2, category: delete}
  create_event: {default_class: R1, category: create}
  modify_event: {default_class: R1, category: modify}
  delete_event: {default_class: R2, category: delete}
  create_record: {default_class: R1, category: create}
  modify_record: {default_class: R1, category: modify}
  delete_record: {default_class: R2, category: delete}
  send_message: {default_class: R3, category: send}
  submit_form: {default_class: R3, category: submit}
  place_order: {default_class: R3, category: submit}
  cancel_order: {default_class: R3, category: modify}
  make_payment: {default_class: R3, category: pay}

commit_scopes:
  - local_app
  - local_filesystem
  - shared_environment
  - external_sandbox

checkpoint_required_classes: [R2, R3]

milestone_observability:
  - environment_state
  - auditable_tool_output
  - derived_from_observable
  - unobservable
