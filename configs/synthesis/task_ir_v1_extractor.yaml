send_temperature: false
temperature: 1.0
reasoning_effort: medium
max_completion_tokens: 64000
timeout_s: 900
prompt_system: prompts/synthesis/task_ir_v1_system.txt
prompt_user: prompts/synthesis/task_ir_v1_user.txt
world_sources_config: configs/synthesis/world_sources_v0.yaml
