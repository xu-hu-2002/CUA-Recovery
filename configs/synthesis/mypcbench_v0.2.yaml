schema_version: synthesis-config/0.2
generation_version: mypcbench-task-synthesis-v0.2
target_count: 100
target_environment: mypcbench-michael-scott
target_snapshot: mypcbench-base-v1
source_split: source-development
sampling_mode: empirical_only
seed: 20260902
max_attempts: 5000
beam_width: 32
min_modules: 2
max_modules: 5
dependency_depth: [5, 9]
cross_app_dependencies: [2, 5]
max_independent_component_ratio: 0.25
required_delayed_reuse: true
carry_threshold: 3
max_irreversible_actions: 1
allowed_irreversible_actions: [send_message, create_event]
min_verifier_coverage: 1.0
failure_reweighting:
  enabled: false
  alpha: 1.0
  beta: 1.0
  min_exposures: 10
  adjustment_range: [0.5, 2.0]
reversibility_sampling:
  mode: empirical_stratified
  classes: [R0, R1, R2, R3]
  min_pilot_per_available_class: 10
  force_uniform_distribution: false
depth_grid: [0, 5, 10, 15, 20, 25]
ontology_config: configs/synthesis/ontology_v0.2.yaml
failure_taxonomy_config: configs/synthesis/failure_taxonomy_v0.1.yaml
