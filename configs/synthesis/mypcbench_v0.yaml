schema_version: synthesis-config/0.1
generation_version: mypcbench-task-synthesis-v0.1
target_count: 100
target_environment: mypcbench-michael-scott
target_snapshot: mypcbench-base-v1
source_split: source-development
sampling_mode: empirical_only
seed: 20260902
max_attempts: 5000
beam_width: 32
min_modules: 2
max_modules: 5
dependency_depth: [5, 9]
cross_app_dependencies: [2, 5]
max_independent_component_ratio: 0.25
required_delayed_reuse: true
max_irreversible_actions: 1
min_verifier_coverage: 1.0
failure_reweighting:
  alpha: 1.0
  beta: 1.0
  min_exposures: 10
  adjustment_range: [0.5, 2.0]
type_system:
  parents:
    AirportCity: [CityRef]
    EmailAddress: [PersonIdentifier]
    MoneyAmount: [NumericValue]
  converters:
    - from: DateTime
      to: Date
      converter_id: datetime_to_local_date_v1
