meta:
  schema_version: "phase0-proposal-1"
  step_index_base: 0
  primary_key: [trajectory_id, annotator]
  join_key_across_agents: task_id

fields:

  task_id:
    store: canonical
    column: task_id
    confidence: high

  agent:
    store: canonical
    column: source_agents
    confidence: high

  annotator:
    store: multi
    column:
      failure_annotations: annotator_id
      rubric_scores: reviewer_id
      cleaning_proposals: reviewer_id
      rollout_flags: annotator_id
    confidence: high

  rollout_valid:
    store: derived
    rule: wrong_rollout_iff_rollout_flags_file_exists
    confidence: medium

  wrong_rollout_reason:
    store: rollout_flags
    column: reason
    confidence: medium

  agent_self_report:
    store: derived
    rule: terminal_action_status
    confidence: medium

  human_verdict:
    store: absent
    confidence: absent

  perfect_success:
    store: absent
    confidence: absent

  rubric_scores:
    store: rubric_scores
    column: scores
    confidence: high

  weighted_rubric_score:
    store: derived
    rule: dot_product_scores_with_task_config_weights
    confidence: medium

  task_score:
    store: rubric_scores
    column: task_success
    confidence: high

  root_cause_step:
    store: failure_annotations
    column: root_cause_action_index
    confidence: high

  clear_failure_step:
    store: failure_annotations
    column: identifiable_at_action_index
    null_means: right_censored
    confidence: high

  failure_depth:
    store: failure_annotations
    column: error_horizon_actions
    confidence: high

  error_types:
    store: failure_annotations
    column: error_types
    confidence: high

  reversibility:
    store: failure_annotations
    column: reversibility
    confidence: high

  clean_prefix_range:
    store: derived
    rule: audited_actions_before_root_cause_minus_drop_candidates
    confidence: low

  trajectory_length:
    store: canonical
    column: canonical_action_count
    confidence: high

  confidence:
    store: absent
    confidence: absent

analysis_set:
  agent_annotator_whitelist:
    gpt_5_5: Haoming
    claude_opus_4_8: xuhu
    evocua_32b: Jinxin
  require_rubric_review: true
  exclude_wrong_rollout: true
  low_n_threshold: 10

scope:
  task_score: true
  rubric_score: true
  error_types: true
  error_depth: true
  reversibility: false
  clean_prefix: false
  sole_blocker: false
  cooccurrence: false
  self_report_confusion: false

depth_bins:
  edges: [0, 2, 5]  # -> "0-1", "2-4", "5+"
  labels: ["0-1", "2-4", "5+"]

bootstrap:
  n_resamples: 10000
  seed: 42

label_normalization:
  rename:
    wrong_subgoal: misunderstand_task_objective
  drop:
    - gui_workflow_bypass

error_category_source: spec  # spec | taxonomy_export

error_categories:
  spec:
    planning:    [fabricate_data, misunderstand_task_objective, lack_of_knowledge, scope_error]
    perception:  [progress_misperception, detail_misperception, state_misinterpretation,
                  ineffective_action]
    execution:   [grounding_failure, incorrect_ui_element,
                  typing_or_parameter_error, section_content_misplacement]
    termination: [fail_to_terminate, premature_completion]
  taxonomy_export:
    planning:    [lack_of_knowledge]
    perception:  []
    execution:   [detail_misperception, gui_workflow_bypass, ineffective_action,
                  scope_error, section_content_misplacement]
    termination: []

annotation_protocol:
  double_annotation:
    agents: [qwen3_5_35b_a3b, evocua_32b, opencua_72b]
    fraction: 0.30
    stratify_by: task_category
    seed: 42
  human_llm_agreement:
    judge_result_file: osworld_full_traj_result.json
    judge_pass_field: passed
    unit: task
