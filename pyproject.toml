[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-recovery"
version = "0.1.0"
description = "CUA-Recovery benchmark and ReRail pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "CUA-Recovery authors"}
]
dependencies = ["jsonschema>=4.20,<5", "PyYAML>=6"]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54"]
collection = [
  "backoff>=2.2",
  "httpx>=0.27",
  "loguru>=0.7",
  "openai>=1.30",
  "Pillow>=10",
]
dev = ["ruff>=0.8"]

[project.scripts]
recovery = "recovery.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
ignore = ["UP045"]
