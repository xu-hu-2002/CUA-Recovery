# Drop-in for every MyPCBench web-app unit (execution doc v1.2 section 4.2).
# Install as /etc/systemd/system/mypcbench-<app>.service.d/derail-trace.conf for each app
# (infra/README.md lists the loop), then `systemctl daemon-reload && systemctl restart
# mypcbench-apps.target`.  DATABASE_APP_NAME is already set by every unit and names the log.
[Service]
Environment="NODE_OPTIONS=--require /opt/derail/trace.js"
Environment=DERAIL_TRACE_DIR=/data/_trace
Environment=DERAIL_CURSOR_FILE=/data/_derail/cursor.json
